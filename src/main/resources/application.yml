spring:
  application:
    name: imperial-qr
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:imperialdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

imperial:
  impuesto-consumo: 0.08
  propina-sugerida: 0.10
  costo-envio-base: 5000.00
  jwt:
    secret: ${JWT_SECRET:imperial-secret-key-super-secure-must-be-at-least-256-bits-long-2024}
    expiration-hours: 8

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  port: 8080
